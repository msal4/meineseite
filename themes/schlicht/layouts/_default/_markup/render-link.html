{{- $attrs := dict "href" .Destination }}
{{- if strings.HasPrefix .Destination "http" }}
  {{- $attrs = merge $attrs (dict "target" "_blank" "rel" "noopener") }}
{{- end }}
{{- with .Title }}
  {{- $attrs = merge $attrs (dict "title" .) }}
{{- end }}
<a
  {{- range $k, $v := $attrs }}
    {{- with $v }}
      {{- printf " %s=%q" $k $v | safeHTMLAttr }}
    {{- end }}
  {{- end -}}
>{{ .Text | safeHTML }}</a>
