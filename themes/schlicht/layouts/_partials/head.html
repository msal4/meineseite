<script data-goatcounter="https://sarray.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ printf "%s | %s" .Title site.Title }}{{ end }}</title>

{{- $description := .Description | default site.Params.description }}
<meta name="description" content="{{ $description }}">
<link rel="canonical" href="{{ .Permalink }}">

<meta property="og:title" content="{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }}{{ end }}">
<meta property="og:description" content="{{ $description }}">
<meta property="og:type" content="{{ if and (eq .Section "blog") (eq .Kind "page") }}article{{ else }}website{{ end }}">
<meta property="og:url" content="{{ .Permalink }}">
<meta property="og:site_name" content="{{ site.Title }}">

<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }}{{ end }}">
<meta name="twitter:description" content="{{ $description }}">

{{ partialCached "head/css.html" . }}
{{ partialCached "head/js.html" . }}

<script type="application/ld+json">
{{- dict
  "@context" "https://schema.org"
  "@type" "Person"
  "name" "Salman Sarray"
  "jobTitle" "Performance Engineering Consultant"
  "url" site.BaseURL
  "sameAs" (slice "https://github.com/msal4" "http://linkedin.com/in/4msal")
  "address" (dict "@type" "PostalAddress" "addressLocality" "Munich" "addressCountry" "DE")
  | jsonify (dict "indent" "  ")
  | safeJS
}}
</script>
